name: TVBox source health check

on:
  schedule:
    - cron: '20 1 * * *' # 09:20 Asia/Taipei, GitHub may delay scheduled runs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check existing TVBox sources
        run: python check_sources.py
      - name: Check candidate sources
        run: python check_candidates.py
      - name: Discover new sources
        run: python discover_sources.py
      - name: Commit reports only if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source_health.md candidate_health.md discovery_report.md
          if ! git diff --cached --quiet; then
            git commit -m 'Update TVBox source health reports'
            git push
          fi
